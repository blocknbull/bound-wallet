<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:#0b0b10;color:#e6e6f0;
  font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;position:relative}
.glow{position:absolute;inset:0;background:
  radial-gradient(900px 620px at 72% 30%, rgba(124,108,255,.22), transparent 62%),
  radial-gradient(700px 520px at 16% 80%, rgba(180,140,255,.11), transparent 66%)}
.wrap{position:relative;text-align:center}
img.mark{mix-blend-mode:screen}

.wrap{text-align:left;max-width:1400px}
.num{font-size:32px;letter-spacing:8px;color:#9a8cff;font-weight:600}
h2{font-size:128px;font-weight:700;letter-spacing:-5px;margin-top:16px;line-height:1}
p{font-size:44px;color:#b4b4c8;margin-top:26px;letter-spacing:-.4px}
.rule{width:150px;height:5px;background:#7c6cff;border-radius:3px;margin-top:44px}

</style></head><body><div class="glow"></div><div class="wrap"><div class="num">01</div><h2>The policy</h2><p>Set once by the owner. Enforced by the contract, every time.</p><div class="rule"></div></div></body></html>
