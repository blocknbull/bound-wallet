<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:#0b0b10;color:#e6e6f0;
  font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;position:relative}
.glow{position:absolute;inset:0;background:
  radial-gradient(900px 620px at 72% 30%, rgba(124,108,255,.22), transparent 62%),
  radial-gradient(700px 520px at 16% 80%, rgba(180,140,255,.11), transparent 66%)}
.wrap{position:relative;text-align:center}
img.mark{mix-blend-mode:screen}

img.mark{width:540px;height:540px;margin-bottom:-40px}
h1{font-size:148px;font-weight:700;letter-spacing:-6px;margin-top:10px}
p{font-size:44px;color:#b4b4c8;margin-top:16px;letter-spacing:-.5px}
.rule{width:120px;height:5px;background:#7c6cff;border-radius:3px;margin:46px auto 0}

</style></head><body><div class="glow"></div><div class="wrap"><img class="mark" src="../../../brand/hd/spiral.png">
<h1>Bound</h1><p>Your agent can spend. It cannot overspend.</p><div class="rule"></div></div></body></html>
