<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
/* Left: what you are looking at. Right: an empty bezel; lib.sh lays the
   dashboard recording into it at 1236,81 (544x918). Keep the two in step. */
body{display:block}
.copy{position:absolute;left:140px;top:250px;width:960px}
.kick{display:flex;align-items:center;gap:18px}
.dot{width:14px;height:14px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 7px rgba(74,222,128,.16)}
.beats{position:relative;height:430px;margin-top:38px}
.beat{position:absolute;inset:0}
h2{font-size:112px;font-weight:700;letter-spacing:-4.5px;line-height:1.02;text-wrap:balance}
p{font-size:42px;color:#b4b4c8;margin-top:30px;letter-spacing:-.4px;line-height:1.32;max-width:880px;text-wrap:balance}
.acct{display:inline-block;margin-top:6px;padding:14px 26px;border-radius:999px;font-size:32px;
  color:#b9aeff;background:rgba(124,108,255,.13);border:1px solid rgba(124,108,255,.28)}
.bezel{position:absolute;left:1224px;top:69px;width:568px;height:942px;border-radius:46px;
  background:#0d0d14;border:1px solid rgba(255,255,255,.12);
  box-shadow:0 0 0 1px rgba(0,0,0,.6),0 40px 120px rgba(0,0,0,.55),0 0 140px rgba(124,108,255,.18)}
</style></head><body><div class="glow"></div>
<div class="copy">
  <div class="kick fade" style="--d:.1s"><span class="dot"></span><span class="label"></span></div>
  <div class="beats"></div>
  <div class="acct fade" style="--d:.6s"></div>
</div>
<div class="bezel"></div>
<script src="copy.js"></script><script>
// Each caption comes in as its screen does and leaves just before the next.
const q = new URLSearchParams(location.search);
document.querySelector('.label').textContent = `${q.get('n')} · ${COPY.live.label}`;
document.querySelector('.acct').textContent = COPY.live.account;
const beats = q.get('beats').split(',').map((b) => b.split(':'));
const IN = 'rise .9s cubic-bezier(.16,1,.3,1)', OUT = 'leave .35s ease-in';
let t = 0;
beats.forEach(([key, secs], i) => {
  const start = i ? t + 0.05 : 0.25, end = t + Number(secs) - 0.4, last = i === beats.length - 1;
  const el = document.createElement('div');
  el.className = 'beat';
  for (const [tag, text, lag] of [['h2', COPY.beats[key].title, 0], ['p', COPY.beats[key].sub, 0.2]]) {
    const n = document.createElement(tag);
    n.textContent = text;
    n.style.animation = `${IN} ${start + lag}s both` + (last ? '' : `, ${OUT} ${end}s forwards`);
    el.append(n);
  }
  document.querySelector('.beats').append(el);
  t += Number(secs);
});
</script></body></html>
