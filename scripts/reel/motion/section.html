<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.wrap{text-align:left;width:1400px}
h2{font-size:150px;font-weight:700;letter-spacing:-6px;margin-top:20px;line-height:1}
p{font-size:46px;color:#b4b4c8;margin-top:30px;letter-spacing:-.4px;max-width:1200px;line-height:1.3;text-wrap:balance}
.rule{width:150px;height:5px;background:#7c6cff;border-radius:3px;margin-top:46px}
</style></head><body><div class="glow"></div><div class="wrap">
<div class="kick fade" style="--d:.05s"></div>
<h2 class="rise" style="--d:.12s"></h2>
<p class="rise" style="--d:.34s"></p>
<div class="rule grow" style="--d:.6s"></div></div>
<script src="copy.js"></script><script>
const q = new URLSearchParams(location.search), c = COPY.sections[q.get('c')];
document.querySelector('.kick').textContent = `${q.get('n')} · ${c.label}`;
document.querySelector('h2').textContent = c.title;
document.querySelector('p').textContent = c.sub;
</script></body></html>
