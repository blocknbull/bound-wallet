<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.wrap{text-align:center}
img.mark{width:540px;height:540px;margin-bottom:-40px}
h1{font-size:148px;font-weight:700;letter-spacing:-6px;margin-top:10px}
p{font-size:44px;color:#b4b4c8;margin-top:16px;letter-spacing:-.5px}
/* The first frame is the poster X and Near Hunt show for the video, so the
   whole lockup is already there at 0. Only the mark eases back and the rule
   draws. */
.settle{animation:settle 2.8s cubic-bezier(.16,1,.3,1) both}
@keyframes settle{from{transform:scale(1.08)}to{transform:none}}
.rule{width:120px;height:5px;background:#7c6cff;border-radius:3px;margin:46px auto 0;transform-origin:center}
</style></head><body style="--dur:3.4s"><div class="glow"></div><div class="wrap">
<img class="mark settle" src="../../../brand/hd/spiral.png">
<h1>Bound</h1>
<p>Your agent can spend. It cannot overspend.</p>
<div class="rule grow" style="--d:.35s"></div></div></body></html>
