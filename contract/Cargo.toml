[package]
name = "bound-wallet"
version = "0.1.0"
edition = "2021"
description = "Policy-enforced smart wallet for AI agents on NEAR"
license = "MIT"
repository = "https://github.com/TODO/bound"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
proptest = "1"
near-workspaces = { version = "0.23", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
